changelog:
  - date: "2026-09-21"
    version: 1.0.0
    changes:
      - type: feature
        text: "Ground-up rewrite of the PubNub C SDK: a platform-neutral C11 core (with a C99 compatibility mode) built around six pluggable provider families — transport, serialization, crypto, allocator, logger, and platform."
      - type: feature
        text: "Multi-context architecture with no static or global per-context state; multiple independent client contexts operate concurrently in a single process."
      - type: feature
        text: "Pluggable HTTP transport providers: a libcurl-backed backend for hosted platforms and a native BSD-socket backend for constrained and embedded targets."
      - type: feature
        text: "Pluggable allocator providers supporting both a hosted heap-managed model and an embedded no-heap arena model with preallocated per-context/request pools sized for N concurrent in-flight requests."
      - type: feature
        text: "Three request-completion styles for every asynchronous operation: blocking await (sync), completion callback (async), and cooperative single-threaded polling via pubnub_process for no-thread event loops."
      - type: feature
        text: "Request/future handles with a three-level timeout hierarchy (global, endpoint, per-request), configurable in-flight concurrency, and explicit bounded-queue backpressure."
      - type: feature
        text: "Compile-time secure transport (PUBNUB_ENABLE_SECURE_TRANSPORT) with OpenSSL and mbedTLS TLS stacks selectable per transport backend; plaintext requires explicit opt-out."
      - type: feature
        text: "Named build profiles (full, minimal, embedded) with per-profile memory and latency budgets, plus explicit CMake feature toggles for every feature module."
      - type: feature
        text: "Payload crypto module with an AES-256-CBC cryptor using a random initialization vector (identifier ACRH) and a legacy cryptor, exposed through a pluggable crypto provider contract."
      - type: feature
        text: "Publish API: synchronous and asynchronous delivery, GET and POST transport, store flag with per-message TTL, stream-filter metadata, raw JSON value trees, optional body compression, and file-message publishing."
      - type: feature
        text: "Subscribe API (event-engine, PubSub v2): channels, channel groups, presence channels, wildcard subscriptions, stream-filter expressions, and timetoken cursor restore, with typed listeners for messages, signals, message actions, files, presence, and App Context objects."
      - type: feature
        text: "Presence API: here-now, where-now, get/set presence state, and heartbeat."
      - type: feature
        text: "Channel Groups API: add and remove channels, list channels in a group, and remove a group."
      - type: feature
        text: "Message Persistence (Storage) API: fetch messages with metadata, message actions, file, message-type and publisher-UUID includes, reverse ordering, count and start/end bounds, delete messages, and message counts."
      - type: feature
        text: "Message Actions API: add, get, and remove reactions on published messages."
      - type: feature
        text: "Signal API: lightweight signal publishing."
      - type: feature
        text: "Files API: send, list, download, delete, generate a file URL, and publish a file message."
      - type: feature
        text: "App Context (Objects v2) API: get/set/remove UUID and channel metadata, list all UUID and channel metadata, and manage memberships and channel members."
      - type: feature
        text: "Access Manager v3 API: grant, parse, set, and revoke resource tokens."
      - type: feature
        text: "Mobile Push API: add, remove, and list channels for a device and remove a device, for the APNS2 and FCM gateways."
      - type: feature
        text: "Time API: fetch the current PubNub network timetoken."
