supported-platforms:
  - version: PubNub POSIX C SDK
    platforms:
      - Modern Linux distributions (glibc-based, released within the last few years) on x86-64 and arm64 are supported. Older distributions may require minor build tweaks.
      - macOS 12 (Monterey) or newer on Apple Silicon (arm64) and Intel (x86-64) is supported.
      - TLS/SSL support uses OpenSSL 3.0 or newer via the libcurl transport backend. If TLS is disabled at compile time (PUBNUB_ENABLE_SECURE_TRANSPORT=OFF), OpenSSL is not required.
  - version: PubNub Windows C SDK
    platforms:
      - Windows 10 or newer on x86-64, built with a recent MSVC, Clang, or MinGW toolchain.
      - TLS/SSL support uses OpenSSL 3.0 or newer via the libcurl transport backend. If TLS is disabled at compile time, OpenSSL is not required.
  - version: PubNub FreeRTOS SDK
    platforms:
      - FreeRTOS with a lwIP-compatible BSD socket layer is supported through the native socket transport backend and the embedded no-heap profile.
      - TLS/SSL support uses mbedTLS. If TLS is disabled at compile time, mbedTLS is not required.
  - version: PubNub ESP32 SDK
    platforms:
      - ESP-IDF 5.2 or newer (and Zephyr on the nRF7002 DK) is supported through the native socket transport backend and the embedded profile.
      - TLS/SSL support uses mbedTLS. If TLS is disabled at compile time, mbedTLS is not required.
