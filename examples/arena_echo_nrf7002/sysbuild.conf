# Sysbuild configuration for the nRF7002 DK arena-echo example.
# SB_CONFIG_WIFI_NRF70 instructs NCS sysbuild to include the nRF7002
# companion-chip firmware (QSPI-loaded radio firmware) in the merged
# flash image. Without this the WiFi driver has no firmware to upload
# to the companion chip and the WiFi interface never registers.
SB_CONFIG_WIFI_NRF70=y
