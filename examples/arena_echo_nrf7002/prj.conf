# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
# Peak socket usage: 2 TCP (subscribe+heartbeat) + 2 UDP (DNS) + 1 UDP (SNTP)
# = 5 concurrent. 8 leaves 3 spare for Zephyr internals.
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_CONTEXT_SYNC_RECV=y
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1

# WiFi (nRF7002 companion chip) — NCS v3.3.x symbol names
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_READY_LIB=y
CONFIG_NRF_WIFI_RPU_RECOVERY=y

# TLS — NCS uses MBEDTLS_LIBRARY_NRF_SECURITY automatically when WiFi is
# enabled; do NOT set MBEDTLS_BUILTIN which would conflict with it.
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_MBEDTLS=y
# Reduce TLS record buffers from 16KB defaults — PubNub HTTP
# payloads fit easily; saves ~24KB heap per TLS session.
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048
# mbedTLS uses a dedicated static heap (not the system heap).
# Default is 512B — far too small for TLS. Need ~32KB for 2
# concurrent HTTPS sessions (record buffers + handshake state +
# certificate parsing). Two concurrent handshakes require ~28-32KB
# of temporary cert-parsing space; TLS handshake serialization
# (planned) will allow reducing this further.
CONFIG_MBEDTLS_HEAP_SIZE=49152
# PubNub servers negotiate ECDHE-RSA-AES128-GCM-SHA256 (TLS 1.2).
# NCS nrf_security PSA-only mode hides legacy MBEDTLS_ECDH_C /
# MBEDTLS_RSA_C / MBEDTLS_PKCS1_V15 behind `if MBEDTLS_LEGACY_CRYPTO_C`,
# making hostap's `select` statements ineffective. The cipher suite
# dependency checks (MBEDTLS_HAS_RSA_CIPHERSUITE_REQUIREMENTS) have no
# PSA-equivalent path. Enable legacy crypto so the full ECDHE-RSA
# cipher suite chain resolves.
CONFIG_MBEDTLS_LEGACY_CRYPTO_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_GCM_C=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y

# SNTP for TLS cert validation
CONFIG_SNTP=y

# Workaround: hostap selects POSIX_TIMERS but never calls timer_create().
# Zephyr's timer.c fails to compile with picolibc (missing sigev_notify_function
# in struct sigevent). Skip that file — no actual POSIX timer consumer exists.
CONFIG_APP_SKIP_POSIX_TIMERS=y

# DNS resolver
CONFIG_DNS_RESOLVER=y

# Arena pool: auto-computed minimum is Zone A (16384) + Zone B (~17.7KB) = ~34.2KB.
# The TLS session cache enlarges pn_mbedtls_ctx, raising the TLS-context Zone B
# bound by ~2.5KB. 39424 keeps ~5KB headroom above the minimum. After the arena
# ownership fix (PUBNUB_CFG_ARENA_POOL_OWNER_SDK=0), only this one pool exists —
# the SDK no longer allocates a duplicate static pool.
CONFIG_PUBNUB_CFG_ARENA_POOL_SIZE=39424

# System heap: WiFi driver misc allocations only (data/ctrl have dedicated heaps;
# mbedTLS has its own heap; SDK uses arena). NCS WiFi station sample uses 65536.
# Reduced from 98304 — saves 32KB.
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y

# Stack sizes
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096

# Network buffers (tuned from NCS WiFi station sample)
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=16
# TX count reduced from 32: PubNub HTTP GETs fragment to 2-4 net_buf each;
# 2 concurrent requests need at most ~8 fragments. 16 is ample.
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_TC_TX_COUNT=1

# Socket poll limit: MAX_IN_FLIGHT_REQUESTS + 2 DNS sockets
CONFIG_ZVFS_POLL_MAX=8

# Entropy (automatic via PSA crypto external RNG from board defconfig)
CONFIG_ENTROPY_GENERATOR=y

# nRF7002 companion chip dedicated heaps (required for driver init)
# CTRL heap: WPA2 handshake + management frames peak ~6KB. 16KB is safe
# (reduced from 20KB, saves 4KB).
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=16384
# DATA heap: holds RX packet buffers DMA'd from nRF7002 firmware.
# With NRF70_RX_NUM_BUFS=16: 16 x ~1600B = ~26KB minimum + ~4KB overhead.
# 40KB is intentionally kept — reducing requires proportional RX buf reduction
# and WiFi stability testing under burst traffic. Deferred.
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=40000
CONFIG_NRF70_RX_NUM_BUFS=16

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096

# Interactive shell for WiFi/net diagnostics (disable for production to save
# ~6KB RAM: shell_uart_stack 4KB + shell_uart_ctx + history heap).
CONFIG_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_SHELL=y
