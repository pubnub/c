# nRF7002 DK board-specific overrides.
# WiFi driver and WPA supplicant are configured in prj.conf.
# Entropy comes from the hardware RNG via MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG
# which is already set by the board defconfig.

# WiFi and PubNub credentials — fill in before building.
CONFIG_PUBNUB_EXAMPLE_WIFI_SSID="ssid"
CONFIG_PUBNUB_EXAMPLE_WIFI_PASSWORD="pwd"
CONFIG_PUBNUB_EXAMPLE_PUBLISH_KEY="demo"
CONFIG_PUBNUB_EXAMPLE_SUBSCRIBE_KEY="demo"
CONFIG_PUBNUB_EXAMPLE_USER_ID="nrf7002-echo"
